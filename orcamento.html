<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="orcamento.css">
    <title>Orçamento</title>
</head>

<body>

    <div class="main-container">
        <div class="card">
            <div class="top-line"></div>

            <!-- Cabeçalho do Card -->
            <div class="header-card">
                <div class="header-left">
                    <h1>Olá <span>Visitante!</span></h1>
                    <p>Qual produto deseja?</p>
                </div>
                <div class="header-right">
                    <i class="fa-solid fa-trophy trophy-icon"></i>
                    <p>Preencha os dados dos produtos que deseja e envie sua solicitação.</p>
                </div>
            </div>

            <form>
                <!-- Container onde os blocos de produtos serão injetados dinamicamente -->
                <div id="products-container">
                    <!-- Bloco do Produto 1 (Inicial) -->
                    <div class="product-item">
                        <div class="product-header-bar">
                            <div class="product-title-area">
                                <span class="product-number">1</span>
                                <span class="product-title-text">Produto 1</span>
                            </div>
                            <button type="button" class="btn-delete" title="Remover produto">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>

                        <div class="product-grid">
                            <!-- Produto -->
                            <div class="form-group">
                                <label>Produto *</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-box left-icon"></i>
                                    <select required>
                                        <option value="" disabled selected>Selecione o produto</option>
                                        <option value="medalha">Medalha</option>
                                        <option value="trofeu">Troféu</option>
                                        <option value="placa">Placa</option>
                                        <option value="pedra">Pedra</option>
                                        <option value="brinde">Brinde</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down right-icon"></i>
                                </div>
                            </div>

                            <!-- Material -->
                            <div class="form-group">
                                <label>Material *</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-layer-group left-icon"></i>
                                    <select required>
                                        <option value="" disabled selected>Selecione o material</option>
                                        <option value="acrilico">Acrílico</option>
                                        <option value="acm">ACM</option>
                                        <option value="mdf">MDF</option>
                                        <option value="metal">Metal</option>
                                        <option value="polimero">Polímero</option>
                                        <option value="zamac">Zamac</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down right-icon"></i>
                                </div>
                            </div>

                            <!-- Quantidade -->
                            <div class="form-group">
                                <label>Quantidade *</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-hashtag left-icon"></i>
                                    <input type="text" placeholder="Qtd." required>
                                </div>
                            </div>

                            <!-- Data -->
                            <div class="form-group">
                                <label>Data *</label>
                                <div class="input-wrapper">
                                    <i class="fa-regular fa-calendar left-icon"></i>
                                    <input type="text" placeholder="dd/mm/aaaa" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" required>
                                    <i class="fa-regular fa-calendar right-icon"></i>
                                </div>
                            </div>

                            <!-- Observação -->
                            <div class="form-group observation-group">
                                <label>Observação</label>
                                <div class="input-wrapper">
                                    <i class="fa-regular fa-file-lines left-icon"></i>
                                    <textarea placeholder="Informe detalhes, tamanho, personalizações, etc."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botão Adicionar Outro Produto -->
                <button type="button" id="btn-add-product" class="btn-add-product">
                    <i class="fa-solid fa-plus"></i> Adicionar produto
                </button>

                <!-- Botão Enviar Solicitação -->
                <!-- Botão Enviar Solicitação via WhatsApp -->
                <button type="submit" class="btn-submit">
                    <i class="fa-brands fa-whatsapp"></i> Enviar Solicitação
                </button>
            </form>
        </div>
    </div>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon-container">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3>Atenção</h3>
            <p id="modal-message">Mensagem de aviso aqui...</p>
            <button type="button" id="modal-close-btn">Entendido</button>
        </div>
    </div>

    <!-- Script JS -->
    <script src="orcamento.js"></script>
</body>

</html>
